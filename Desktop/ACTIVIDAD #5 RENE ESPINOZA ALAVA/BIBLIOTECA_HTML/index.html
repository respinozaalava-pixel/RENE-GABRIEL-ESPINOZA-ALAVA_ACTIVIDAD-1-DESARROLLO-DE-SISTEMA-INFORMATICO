<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Librería de Componentes UI - Help Desk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <h1>📚 Sistema de Diseño - Help Desk</h1>
    <p style="margin-bottom: 2rem;">Colección de componentes reutilizables para el sistema de gestión de incidentes.</p>

    <!-- SECCIÓN: BOTONES -->
    <section class="seccion">
      <h2>Botones</h2>
      <button class="btn btn-primario">Botón Primario</button>
      <button class="btn btn-secundario">Botón Secundario</button>
      <button class="btn btn-peligro">Botón de Peligro</button>
    </section>

    <!-- SECCIÓN: FORMULARIOS -->
    <section class="seccion">
      <h2>Campos de Formulario</h2>
      <div class="grupo-campo">
        <label for="asunto">Asunto del ticket</label>
        <input type="text" id="asunto" placeholder="Ingrese el asunto...">
      </div>
      <div class="grupo-campo">
        <label for="categoria">Categoría</label>
        <select id="categoria">
          <option value="">Seleccione una opción</option>
          <option value="hardware">Hardware</option>
          <option value="software">Software</option>
          <option value="acceso">Acceso al sistema</option>
        </select>
      </div>
    </section>

    <!-- SECCIÓN: TARJETAS -->
    <section class="seccion">
      <h2>Tarjetas</h2>
      <div class="tarjeta">
        <h3 class="tarjeta__titulo">Ticket #0045</h3>
        <p class="tarjeta__contenido">El equipo no enciende después de la actualización del sistema operativo.</p>
        <span class="etiqueta etiqueta-alta">Prioridad Alta</span>
      </div>
    </section>

    <!-- SECCIÓN: ETIQUETAS -->
    <section class="seccion">
      <h2>Etiquetas de Prioridad</h2>
      <span class="etiqueta etiqueta-alta">Alta</span>
      <span class="etiqueta etiqueta-media">Media</span>
      <span class="etiqueta etiqueta-baja">Baja</span>
    </section>
  </div>
</body>
</html>
